services:
  - type: web
    name: beyondecho-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: VOICE_PROVIDER
        value: coqui
      - key: COQUI_API_URL
        sync: false                    # paste your Colab ngrok URL here
      - key: CORS_ORIGINS
        sync: false
